<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It's Britney Bitch Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Bungee&family=Orbitron:wght@900&family=Pacifico&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="website">

    <!-- POSTER: built from live HTML/CSS. City buttons are generated by script.js from one list. -->
    <section class="cover" id="cover">
      <div class="poster">
        <div class="layer hero" role="img" aria-label="Britney with a pink teddy bear"></div>
        <div class="layer star s1"></div>
        <div class="layer star s2"></div>
        <div class="layer star s3"></div>
        <div class="layer guest"></div>
        <p class="guest-label">Special Guest!</p>
        <h1 class="title"><span>It's Britney</span><b>BITCH!</b><span>Tour</span></h1>
        <div class="barcode" aria-hidden="true"><i></i><span>BITCH!</span></div>
        <div class="locations" id="locations"></div>
      </div>
    </section>

    <!-- SPREADS -->
    <section class="magazine" id="magazine" hidden>
      <div class="spread" id="spread"></div>
      <nav class="controls">
        <button onclick="previousPage()">← Previous</button>
        <button onclick="backToCover()">Cover</button>
        <button onclick="nextPage()">Next →</button>
      </nav>
    </section>

  </main>
</body>
</html>
