<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It's Britney Bitch Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bacasime+Antique&family=BBH+Hegarty&family=Libre+Barcode+128+Text&family=Luxurious+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="website">

    <section class="cover" id="cover">
      <div class="poster">
        <div class="layer hero" role="img" aria-label="Britney with a pink teddy bear"></div>
        <div class="layer star s1"></div>
        <div class="layer star s2"></div>
        <div class="layer star s3"></div>
        <div class="layer star s4"></div>
        <div class="guest">
          <div class="guest-photo"></div>
          <svg viewBox="0 0 100 100" aria-label="Special Guest!">
            <path id="guest-arc" d="M18.82 68 A36 36 0 1 1 81.18 68" fill="none"/>
            <text><textPath href="#guest-arc" startOffset="50%" text-anchor="middle">Special Guest!</textPath></text>
          </svg>
          <img class="signature" src="assets/signature.png" alt="">
        </div>
        <h1 class="title"><span>It's Britney</span><b>BITCH!</b><span>Tour</span></h1>
        <div class="barcode" role="img" aria-label="Barcode reading BITCH!">BITCH!</div>
        <div class="locations" id="locations"></div>
      </div>
    </section>

    <section class="magazine" id="magazine" hidden>
      <div class="spread" id="spread"></div>
      <nav class="controls">
        <button onclick="previousPage()">← Previous</button>
        <button onclick="backToCover()">Cover</button>
        <button onclick="nextPage()">Next →</button>
      </nav>
    </section>

  </main>
</body>
</html>
